<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* Add any specific styles for this page if needed */
    </style>
</head>
<body class="bg-yellow-300 text-black font-sans antialiased p-4 md:p-8">

    <div class="max-w-3xl mx-auto p-6 md:p-8 bg-blue-500 border-4 border-black shadow-[8px_8px_0px_#000]">
        <h1 class="text-3xl md:text-4xl mb-6 text-center font-extrabold tracking-tight text-white stroke-black">
             MY TASKS
        </h1>
        <nav class="mb-8 flex justify-center space-x-4">
             <a href="/index.html" class="px-4 py-2 font-semibold text-white bg-black/20 rounded-md shadow-[2px_2px_0px_#000] hover:bg-black/40 active:translate-y-0.5 active:shadow-[1px_1px_0px_#000]">Home</a>
             <a href="/add-task.html" class="px-4 py-2 font-semibold text-white bg-black/20 rounded-md shadow-[2px_2px_0px_#000] hover:bg-black/40 active:translate-y-0.5 active:shadow-[1px_1px_0px_#000]">Add Task</a>
             <a href="/manage.html" class="px-4 py-2 font-semibold text-white bg-black/20 rounded-md shadow-[2px_2px_0px_#000] hover:bg-black/40 active:translate-y-0.5 active:shadow-[1px_1px_0px_#000]">Manage</a>
        </nav>

        <!-- Task List Section -->
        <div class="p-4 bg-white border-4 border-black shadow-[4px_4px_0px_#000]">
            <ul id="task-list" class="space-y-4">
                <p class="text-center text-gray-700 font-semibold">Loading tasks...</p>
            </ul>
        </div>
    </div>

    <script>
        // --- Task Fetching and Display ---
        async function fetchTasks() {
            try {
                const response = await axios.get('/tasks');
                const tasks = response.data;
                const taskList = document.getElementById('task-list');
                taskList.innerHTML = '';
                if (tasks.length === 0) {
                    taskList.innerHTML = '<p class="text-center text-gray-700 font-semibold">No tasks yet. <a href="/add-task.html" class="text-pink-600 hover:underline">Add one!</a></p>';
                } else {
                    tasks.forEach(task => {
                        const taskStatusClass = task.done ? 'border-green-500 bg-green-100 hover:bg-green-200' : 'border-yellow-500 bg-yellow-100 hover:bg-yellow-200';
                        const taskStatusText = task.done ? 'Completed' : 'Pending';
                        const toggleStatusText = task.done ? 'Mark Pending' : 'Mark Done';
                        const dueDateText = task.dueDate ? `Due: ${task.dueDate}` : 'No due date';
                        const priorityText = task.priority ? `<span style="color: ${task.priority.color || 'black'}; border: 1px solid ${task.priority.color || 'black'}; padding: 1px 4px; border-radius: 4px; font-size: 0.8em; margin-right: 5px;">${task.priority.level}</span>` : '';
                        const tagsText = task.tags.map(tag => `<span style="background-color: ${ '#eee'}; color: black; border: 1px solid black; text: white; padding: 1px 4px; border-radius: 4px; font-size: 0.8em; margin-right: 5px;">${tag.name}</span>`).join(' ');

                        taskList.innerHTML += `
                            <li class="border-4 border-black p-4 mb-4 bg-white shadow-[4px_4px_0px_#000] flex flex-col space-y-3">
                                <div class="flex justify-between items-start">
                                    <div>
                                        ${priorityText}
                                        <span class="text-lg font-bold">${task.title}</span>
                                    </div>
                                    <span class="text-sm font-semibold px-3 py-1 border-2 border-black ${taskStatusClass}">
                                        ${taskStatusText}
                                    </span>
                                </div>
                                <p class="text-gray-700">${task.description || 'No description.'}</p>
                                <div class="flex justify-between items-center text-sm">
                                    <span class="text-gray-500">${dueDateText}</span>
                                    <div>${tagsText}</div>
                                </div>
                                <div class="flex space-x-2 justify-end">
                                     <button onclick="updateTaskStatus(${task.id}, ${!task.done})" class="px-3 py-1 text-sm font-semibold border-2 border-black ${taskStatusClass} active:translate-y-0.5 active:shadow-[1px_1px_0px_#000]">${toggleStatusText}</button>
                                     <button onclick="deleteTask(${task.id})" class="px-3 py-1 text-sm font-semibold text-white bg-red-600 border-2 border-black shadow-[2px_2px_0px_#000] hover:bg-red-700 active:translate-y-0.5 active:shadow-[1px_1px_0px_#000]">Delete</button>
                                </div>
                            </li>`;
                    });
                }
            } catch (error) {
                console.error("Error fetching tasks:", error);
                document.getElementById('task-list').innerHTML = '<p class="text-center text-red-600 font-semibold">Could not load tasks.</p>';
            }
        }

        // --- Update Task Status ---
        async function updateTaskStatus(id, newStatus) {
            try {
                const getResponse = await axios.get(`/tasks/${id}`);
                const task = getResponse.data;
                task.done = newStatus;
                await axios.put(`/tasks/${id}`, task);
                fetchTasks(); // Refresh the list
            } catch (error) {
                console.error("Error updating task status:", error);
                alert('Failed to update task status.');
            }
        }

        // --- Delete Task ---
        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            try {
                await axios.delete(`/tasks/${id}`);
                fetchTasks(); // Refresh the list
            } catch (error) {
                console.error("Error deleting task:", error);
                alert('Failed to delete task.');
            }
        }

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', fetchTasks);
    </script>

</body>
</html>
