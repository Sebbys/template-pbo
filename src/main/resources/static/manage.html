<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage - Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        input:focus {
            outline: 3px solid #f472b6; /* Pink outline */
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-yellow-300 text-black font-sans antialiased p-4 md:p-8">

    <div class="max-w-3xl mx-auto p-6 md:p-8 bg-blue-500 border-4 border-black shadow-[8px_8px_0px_#000]">
        <h1 class="text-3xl md:text-4xl mb-6 text-center font-extrabold tracking-tight text-white stroke-black">
             MANAGE PRIORITIES & TAGS
        </h1>
        <nav class="mb-8 flex justify-center space-x-4">
             <a href="/index.html" class="px-4 py-2 font-semibold text-white bg-black/20 rounded-md shadow-[2px_2px_0px_#000] hover:bg-black/40 active:translate-y-0.5 active:shadow-[1px_1px_0px_#000]">Home</a>
             <a href="/add-task.html" class="px-4 py-2 font-semibold text-white bg-black/20 rounded-md shadow-[2px_2px_0px_#000] hover:bg-black/40 active:translate-y-0.5 active:shadow-[1px_1px_0px_#000]">Add Task</a>
             <a href="/tasks.html" class="px-4 py-2 font-semibold text-white bg-black/20 rounded-md shadow-[2px_2px_0px_#000] hover:bg-black/40 active:translate-y-0.5 active:shadow-[1px_1px_0px_#000]">View Tasks</a>
        </nav>

        <!-- Management Sections -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Priority Management -->
            <div class="p-4 bg-white border-4 border-black shadow-[4px_4px_0px_#000]">
                <h3 class="text-xl font-bold mb-3 border-b-2 border-black pb-1">Manage Priorities</h3>
                <div class="mb-4">
                    <input id="priority-level" type="text" placeholder="Priority Level (e.g., High)" class="w-full p-2 mb-2 border-2 border-black text-md focus:outline-none focus:ring-2 focus:ring-pink-500">
                    <input id="priority-color" type="color" value="#000000" class="w-full p-1 h-10 mb-2 border-2 border-black cursor-pointer">
                    <button onclick="addPriority()" class="w-full p-2 text-md font-bold text-white bg-green-600 border-2 border-black shadow-[2px_2px_0px_#000] hover:bg-white hover:text-green-600 active:translate-y-0.5">Add Priority</button>
                </div>
                <ul id="priority-list">
                    <p class="text-center text-gray-500 text-sm">Loading priorities...</p>
                </ul>
            </div>

            <!-- Tag Management -->
            <div class="p-4 bg-white border-4 border-black shadow-[4px_4px_0px_#000]">
                <h3 class="text-xl font-bold mb-3 border-b-2 border-black pb-1">Manage Tags</h3>
                <div class="mb-4">
                    <input id="tag-name" type="text" placeholder="Tag Name (e.g., Work)" class="w-full p-2 mb-2 border-2 border-black text-md focus:outline-none focus:ring-2 focus:ring-pink-500">
                    <input id="tag-color" type="color" value="#000000" class="w-full p-1 h-10 mb-2 border-2 border-black cursor-pointer">
                    <button onclick="addTag()" class="w-full p-2 text-md font-bold text-white bg-green-600 border-2 border-black shadow-[2px_2px_0px_#000] hover:bg-white hover:text-green-600 active:translate-y-0.5">Add Tag</button>
                </div>
                <ul id="tag-list">
                    <p class="text-center text-gray-500 text-sm">Loading tags...</p>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // --- Priority Management ---
        async function fetchPriorities() {
            try {
                const response = await axios.get('/priorities');
                const priorities = response.data;
                const priorityList = document.getElementById('priority-list');
                priorityList.innerHTML = '';
                if (priorities.length === 0) {
                    priorityList.innerHTML = '<p class="text-center text-gray-700 font-semibold">No priorities yet.</p>';
                } else {
                    priorities.forEach(priority => {
                        priorityList.innerHTML += `
                            <li class="border-2 border-black p-2 mb-2 bg-gray-100 shadow-[2px_2px_0px_#000] flex justify-between items-center">
                                <span style="color: ${priority.color || 'black'}" class="font-bold">${priority.level}</span>
                                <button onclick="deletePriority(${priority.id})" class="px-2 py-0.5 text-xs font-semibold text-white bg-red-500 border border-black shadow-[1px_1px_0px_#000] hover:bg-red-600 active:translate-y-0.5">X</button>
                            </li>`;                    });
                }
            } catch (error) {
                console.error("Error fetching priorities:", error);
                document.getElementById('priority-list').innerHTML = '<p class="text-center text-red-600 font-semibold">Could not load priorities.</p>';
            }
        }

        async function addPriority() {
            const levelInput = document.getElementById('priority-level');
            const colorInput = document.getElementById('priority-color');
            const level = levelInput.value.trim();
            const color = colorInput.value.trim();
            if (!level) return alert('Priority Level cannot be empty!');
            try {
                await axios.post('/priorities', { level, color });
                levelInput.value = '';
                colorInput.value = '#000000';
                fetchPriorities();
            } catch (error) {
                console.error("Error adding priority:", error);
                alert('Failed to add priority.');
            }
        }

        async function deletePriority(id) {
            if (!confirm('Are you sure you want to delete this priority?')) return;
            try {
                await axios.delete(`/priorities/${id}`);
                fetchPriorities();
            } catch (error) {
                console.error("Error deleting priority:", error);
                alert('Failed to delete priority.');
            }
        }

        // --- Tag Management ---
        async function fetchTags() {
            try {
                const response = await axios.get('/tags');
                const tags = response.data;
                const tagList = document.getElementById('tag-list');
                tagList.innerHTML = '';
                if (tags.length === 0) {
                    tagList.innerHTML = '<p class="text-center text-gray-700 font-semibold">No tags yet.</p>';
                } else {
                    tags.forEach(tag => {
                        tagList.innerHTML += `
                            <li class="border-2 border-black p-2 mb-2 bg-gray-100 shadow-[2px_2px_0px_#000] flex justify-between items-center">
                                <span style="color: ${tag.color || 'black'}" class="font-bold">${tag.name}</span>
                                <button onclick="deleteTag(${tag.id})" class="px-2 py-0.5 text-xs font-semibold text-white bg-red-500 border border-black shadow-[1px_1px_0px_#000] hover:bg-red-600 active:translate-y-0.5">X</button>
                            </li>`;                    });
                }
            } catch (error) {
                console.error("Error fetching tags:", error);
                document.getElementById('tag-list').innerHTML = '<p class="text-center text-red-600 font-semibold">Could not load tags.</p>';
            }
        }

        async function addTag() {
            const nameInput = document.getElementById('tag-name');
            const colorInput = document.getElementById('tag-color');
            const name = nameInput.value.trim();
            const color = colorInput.value.trim();
            if (!name) return alert('Tag Name cannot be empty!');
            try {
                await axios.post('/tags', { name, color });
                nameInput.value = '';
                colorInput.value = '#000000';
                fetchTags();
            } catch (error) {
                console.error("Error adding tag:", error);
                alert('Failed to add tag.');
            }
        }

        async function deleteTag(id) {
            if (!confirm('Are you sure you want to delete this tag?')) return;
            try {
                await axios.delete(`/tags/${id}`);
                fetchTags();
            } catch (error) {
                console.error("Error deleting tag:", error);
                alert('Failed to delete tag.');
            }
        }

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchPriorities();
            fetchTags();
        });
    </script>

</body>
</html>
