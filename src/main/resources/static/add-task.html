<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task - Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        input:focus, select:focus {
            outline: 3px solid #f472b6; /* Pink outline */
            outline-offset: 2px;
        }
        #task-tags { height: 100px; }
    </style>
</head>
<body class="bg-yellow-300 text-black font-sans antialiased p-4 md:p-8">

    <div class="max-w-xl mx-auto p-6 md:p-8 bg-blue-500 border-4 border-black shadow-[8px_8px_0px_#000]">
        <h1 class="text-3xl md:text-4xl mb-6 text-center font-extrabold tracking-tight text-white stroke-black">
             ADD NEW TASK
        </h1>
        <nav class="mb-8 flex justify-center space-x-4">
             <a href="/index.html" class="px-4 py-2 font-semibold text-white bg-black/20 rounded-md shadow-[2px_2px_0px_#000] hover:bg-black/40 active:translate-y-0.5 active:shadow-[1px_1px_0px_#000]">Home</a>
             <a href="/tasks.html" class="px-4 py-2 font-semibold text-white bg-black/20 rounded-md shadow-[2px_2px_0px_#000] hover:bg-black/40 active:translate-y-0.5 active:shadow-[1px_1px_0px_#000]">View Tasks</a>
             <a href="/manage.html" class="px-4 py-2 font-semibold text-white bg-black/20 rounded-md shadow-[2px_2px_0px_#000] hover:bg-black/40 active:translate-y-0.5 active:shadow-[1px_1px_0px_#000]">Manage</a>
        </nav>

        <!-- Add Task Form -->
        <div class="p-4 bg-white border-4 border-black shadow-[4px_4px_0px_#000]">
            <div class="space-y-4">
                <div>
                    <label for="task-title" class="sr-only">Task Title</label>
                    <input id="task-title" type="text" placeholder="Task Title" class="w-full p-3 text-lg font-bold text-black bg-white border-2 border-black focus:outline-none focus:ring-2 focus:ring-pink-500" onkeypress="handleInputKeypress(event)">
                </div>
                 <div>
                    <label for="task-description" class="sr-only">Task Description</label>
                    <input id="task-description" type="text" placeholder="Task Description (Optional)" class="w-full p-3 text-lg font-bold text-black bg-white border-2 border-black focus:outline-none focus:ring-2 focus:ring-pink-500" onkeypress="handleDescriptionKeypress(event)">
                </div>
                <div>
                    <label for="task-due-date" class="sr-only">Due Date</label>
                    <input id="task-due-date" type="date" placeholder="Due Date (Optional)" class="w-full p-3 text-lg font-bold text-black bg-white border-2 border-black focus:outline-none focus:ring-2 focus:ring-pink-500" onkeypress="handleDueDateKeypress(event)">
                </div>
                <div>
                    <label for="task-priority" class="sr-only">Priority</label>
                    <select id="task-priority" class="w-full p-3 text-lg font-bold text-black bg-white border-2 border-black focus:outline-none focus:ring-2 focus:ring-pink-500">
                        <option value="">Loading Priorities...</option>
                        <!-- Options populated by fetchPriorities -->
                    </select>
                </div>
                <div>
                    <label for="task-tags" class="sr-only">Tags</label>
                    <select id="task-tags" multiple class="w-full p-3 text-lg font-bold text-black bg-white border-2 border-black focus:outline-none focus:ring-2 focus:ring-pink-500">
                        <!-- Options populated by fetchTags -->
                    </select>
                    <p class="text-xs text-gray-600 mt-1">Hold Ctrl/Cmd to select multiple tags.</p>
                </div>
                <button onclick="addTask()" class="w-full p-3 text-xl font-bold text-white bg-pink-600 border-2 border-black shadow-[3px_3px_0px_#000] hover:bg-white hover:text-pink-600 active:translate-y-0.5 active:shadow-[1px_1px_0px_#000]">
                    ADD TASK
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Priority Fetching ---
        async function fetchPriorities() {
            try {
                const response = await axios.get('/priorities');
                const priorities = response.data;
                const prioritySelect = document.getElementById('task-priority');
                prioritySelect.innerHTML = '<option value="">Select Priority (Optional)</option>'; // Default option

                if (priorities.length > 0) {
                    priorities.forEach(priority => {
                        prioritySelect.innerHTML += `<option value="${priority.id}">${priority.level}</option>`;
                    });
                }
            } catch (error) {
                console.error("Error fetching priorities:", error);
                document.getElementById('task-priority').innerHTML = '<option value="">Error loading priorities</option>';
            }
        }

        // --- Tag Fetching ---
        async function fetchTags() {
            try {
                const response = await axios.get('/tags');
                const tags = response.data;
                const tagSelect = document.getElementById('task-tags');
                tagSelect.innerHTML = ''; // Clear existing options

                if (tags.length > 0) {
                    tags.forEach(tag => {
                        tagSelect.innerHTML += `<option value="${tag.id}">${tag.name}</option>`;
                    });
                } else {
                     tagSelect.innerHTML = '<option value="" disabled>No tags available</option>'; // Indicate no tags
                }
            } catch (error) {
                console.error("Error fetching tags:", error);
                 tagSelect.innerHTML = '<option value="" disabled>Error loading tags</option>';
            }
        }

        // --- Add Task ---
        async function addTask() {
            const titleInput = document.getElementById('task-title');
            const descriptionInput = document.getElementById('task-description');
            const dueDateInput = document.getElementById('task-due-date');
            const prioritySelect = document.getElementById('task-priority');
            const tagsSelect = document.getElementById('task-tags');

            const title = titleInput.value.trim();
            const description = descriptionInput.value.trim();
            const dueDate = dueDateInput.value || null;
            const priorityId = prioritySelect.value ? parseInt(prioritySelect.value) : null;
            const selectedTagIds = Array.from(tagsSelect.selectedOptions).map(option => parseInt(option.value));

            if (!title) {
                alert('Task Title cannot be empty!');
                return;
            }

            const taskData = {
                title,
                description,
                dueDate,
                done: false,
                priority: priorityId ? { id: priorityId } : null,
                tags: selectedTagIds.map(id => ({ id: id }))
            };

            try {
                const response = await axios.post('/tasks', taskData);
                console.log('Task added:', response.data);
                alert('Task added successfully!'); // Feedback to user

                // Clear form
                titleInput.value = '';
                descriptionInput.value = '';
                dueDateInput.value = '';
                prioritySelect.value = '';
                tagsSelect.selectedIndex = -1;

                // Optionally redirect to task list or stay on page
                // window.location.href = '/tasks.html';

            } catch (error) {
                 console.error("Error adding task:", error);
                 alert('Failed to add task. Please check console for details.');
            }
        }

        // --- Keypress Handlers ---
        function handleInputKeypress(event) {
            if (event.key === 'Enter') {
                 document.getElementById('task-description').focus();
            }
        }
         function handleDescriptionKeypress(event) {
            if (event.key === 'Enter') {
                 document.getElementById('task-due-date').focus();
            }
        }
        function handleDueDateKeypress(event) {
             if (event.key === 'Enter') {
                 // Optionally focus priority or tags, or just trigger add
                 document.getElementById('task-priority').focus();
            }
        }
        // Consider adding handlers for priority/tag selects if needed

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchPriorities();
            fetchTags();
            // Add listeners after elements exist
            document.getElementById('task-title').addEventListener('keypress', handleInputKeypress);
            document.getElementById('task-description').addEventListener('keypress', handleDescriptionKeypress);
            document.getElementById('task-due-date').addEventListener('keypress', handleDueDateKeypress);
        });
    </script>

</body>
</html>
