<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - F1 Standings Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Optional: Add a custom font if desired */
        /* @import url('https://fonts.googleapis.com/css2?family=...'); */
        /* body { font-family: 'Your Font', sans-serif; } */
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center h-screen p-4 font-sans">
    <!-- {/* Neobrutalist Card */} -->
    <div class="bg-white p-8 border-2 border-black shadow-[8px_8px_0_0_#000] w-full max-w-sm">
        <h1 class="text-3xl font-extrabold mb-8 text-center">Admin Login</h1>
        <form id="login-form">
            <div class="mb-5">
                <label for="username" class="block text-sm font-semibold text-gray-800 mb-1">Username</label>
                <!-- {/* Neobrutalist Input Field */} -->
                <input type="text" id="username" name="username" required 
                       class="block w-full px-3 py-2 border-2 border-black text-sm
                              focus:outline-none focus:border-red-500 focus:ring-0"> 
                               <!-- {/* Removed rounded, shadow. Added border-2, black border, red focus border */} -->
            </div>
            <div class="mb-8">
                <label for="password" class="block text-sm font-semibold text-gray-800 mb-1">Password</label>
                <!-- {/* Neobrutalist Input Field */} -->
                <input type="password" id="password" name="password" required 
                       class="block w-full px-3 py-2 border-2 border-black text-sm
                              focus:outline-none focus:border-red-500 focus:ring-0">
                               <!-- {/* Removed rounded, shadow. Added border-2, black border, red focus border */} -->
            </div>
            <!-- {/* Neobrutalist Button */} -->
            <button type="submit" 
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 border-2 border-black 
                           shadow-[4px_4px_0_0_#000] hover:shadow-[6px_6px_0_0_#000] 
                           active:shadow-[2px_2px_0_0_#000] active:translate-x-[2px] active:translate-y-[2px] 
                           focus:outline-none transition-all duration-150">
                Login
            </button>
            <p id="login-message" class="text-sm text-red-600 font-semibold mt-4 text-center h-4"></p> 
            <!-- {/* Added fixed height h-4 to prevent layout shift */} -->
        </form>
        <div class="mt-6 text-center">
             <!-- {/* Simple themed link */} -->
            <a href="/standings.html" class="text-sm text-red-600 hover:text-red-800 hover:underline font-medium">
                &larr; Back to Standings
            </a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageElement = document.getElementById('login-message');

            // Clear previous message
            messageElement.textContent = '';

            if (!username || !password) {
                messageElement.textContent = 'Please enter both username and password.';
                return;
            }

            // --- Authentication Simulation ---
            // In a real app, you'd send username/password to the backend here.
            // The backend would validate and then set a secure, HttpOnly session cookie.
            // For this demo, we just set basic cookies client-side.

            console.log('Simulating login for:', username);

            // Set basic cookies (INSECURE for real applications)
            // The backend DriverController would read these to simulate authentication.
            document.cookie = `username=${encodeURIComponent(username)}; path=/; Max-Age=3600`; // Expires in 1 hour
            document.cookie = `password=${encodeURIComponent(password)}; path=/; Max-Age=3600`; // Expires in 1 hour

            // Redirect to the admin page after setting cookies
            console.log('Credentials set in cookies. Redirecting to admin page...');
            window.location.href = '/admin.html'; 
        });
    </script>
</body>
</html>
